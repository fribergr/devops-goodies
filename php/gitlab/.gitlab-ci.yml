# Avoid detached pipelines
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - analysis
  - docker
  - deploy

variables:
  # Point BUILD_IMAGE to a reasonable image containing your build tools
  BUILD_IMAGE: registry.local/build-images/php-8.5-build
  # Set for performance
  GIT_DEPTH: 10

.not-scheduled:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

cache: &global_cache
  paths:
    - node_modules/
    - vendor/
  policy: pull-push

PHP:
  image: $BUILD_IMAGE
  stage: test
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  extends:
    - .not-scheduled
  script:
    - time npm ci --prefer-offline --no-audit --progress=false
    - time npm run build
    - time composer install --prefer-dist --no-progress
    - time php artisan test --parallel --coverage-text --log-junit junit-report.xml --coverage-cobertura cobertura-report.xml
  artifacts:
    when: on_success
    expire_in: 1month
    paths:
      - build
    reports:
      junit: junit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: cobertura-report.xml

security-check:
  stage: analysis
  image: $BUILD_IMAGE
  needs: []
  cache: []
  allow_failure: true
  script:
    - COMPOSER_AUDIT_ABANDONED=ignore composer audit

phpstan:
  stage: analysis
  image: $BUILD_IMAGE
  needs: ["PHP"]
  extends: .not-scheduled
  allow_failure: true
  cache:
    <<: *global_cache
    policy: pull
  script:
    - ./vendor/bin/phpstan analyse --memory-limit=2G

bundle:
  image: docker:29.9-cli
  stage: docker
  extends: .not-scheduled
  cache: []
  services:
    - docker:29.9-dind
  # The Dockerfile installs dependencies and builds the frontend itself.
  needs:
    - job: PHP
      artifacts: false
  script:
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    # Without --provenance=false the image becomes a manifest list with an attestation, which
    # the registry rejects with "blob unknown" for the image manifest.
    - docker build --provenance=false -f Dockerfile -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA


deploy-test:
    stage: deploy
    image: docker:29.9-cli
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
          when: never
        - when: manual
          allow_failure: true
    needs:
        - bundle
    script:
        - echo "Doing things to deploy to test environment, could be envoy, could be gitops via argocd, could be ansible, etc."
    environment:
        name: test
        deployment_tier: testing
        url: https://testing.local

deploy-prod:
    stage: deploy
    image: docker:29.9-cli
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
          when: never
        - when: manual
          allow_failure: true
    needs:
        - bundle
    script:
        - echo "Doing things to deploy to prod environment, could be envoy, could be gitops via argocd, could be ansible, etc."
    environment:
        name: production
        deployment_tier: production
        url: https://production.local
