; Loaded by every SAPI on top of php.ini-production. FPM overrides some of
; these from /etc/php-fpm/conf.d (see fpm.ini and entrypoint.sh).
[PHP]
; php.ini-production leaves out E, and Laravel reads its config from $_ENV.
variables_order = EGPCS
; php.ini-production keeps the X-Powered-By header, version included.
expose_php = Off

; Every scheduled task and queue worker starts a fresh CLI process. Without a
; shared-memory segment to share, the file cache carries the compiled scripts
; from one process to the next. Timestamps stay validated so that a manual
; `artisan config:cache` inside a running container takes effect.
[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=16229
opcache.validate_timestamps=1
opcache.save_comments=1
opcache.file_cache=/var/cache/php/opcache-cli
opcache.file_cache_only=1
