; Loaded by FPM only: entrypoint.sh appends this directory to
; PHP_INI_SCAN_DIR, so these settings override app.ini for web requests.

; Long-lived FPM workers use the shared-memory cache without per-request
; timestamp validation, and the CLI file cache does not apply to them.
[opcache]
opcache.validate_timestamps=0
opcache.file_cache=
opcache.file_cache_only=0
; Measure your own application before keeping the JIT on. It needs the
; shared-memory cache, so the file-cache-only CLI runs without it.
opcache.jit=tracing
opcache.jit_buffer_size=64M
