[www]
listen=127.0.0.1:9000
listen.mode = 0666
user = www-data
group = www-data
; Each worker can use up to memory_limit, so size these together with the
; container memory limit in the Deployment.
pm = dynamic
pm.max_children = 20
pm.start_servers = 8
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.status_path = /status
catch_workers_output = yes
clear_env=no
