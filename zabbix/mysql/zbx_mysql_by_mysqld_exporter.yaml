        - uuid: 85f79635f28d4c96ae0cce7fee5cc176
          name: 'MySQL: InnoDB buffer pool disk reads'
          type: DEPENDENT
          key: mysql.innodb.reads
          delay: '0'
          value_type: FLOAT
          units: rps
          description: Page reads the buffer pool could not serve, so InnoDB read them from disk.
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_status_innodb_buffer_pool_reads
                - value
                - ''
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: innodb
        - uuid: 824452344f2c4ed39d683f046eac7b4e
          name: 'MySQL: InnoDB buffer pool hit ratio'
          type: CALCULATED
          key: mysql.innodb.hit_ratio
          value_type: FLOAT
          params: 100-100*last(//mysql.innodb.reads)/max(last(//mysql.innodb.read_requests),1)
          units: '%'
          description: Share of page reads served from memory.
          tags:
            - tag: component
              value: innodb
          triggers:
            - uuid: 0cbd758edc744320a18a3d014878afff
              expression: max(/MySQL by mysqld_exporter/mysql.innodb.hit_ratio,15m)<{$MYSQL.BUFFER_POOL.HIT.MIN}
              name: 'MySQL: InnoDB buffer pool hit ratio below {$MYSQL.BUFFER_POOL.HIT.MIN}% for 15m'
              priority: WARNING
              description: The working set of all tenant databases no longer fits in innodb_buffer_pool_size, so queries wait on disk. Raise the buffer pool, and the pod's memory limit with it. A freshly started server reads everything from disk, so this stays quiet while the restart trigger is active.
              dependencies:
                - name: 'MySQL: restarted (uptime {ITEM.LASTVALUE1})'
                  expression: last(/MySQL by mysqld_exporter/mysql.uptime)<{$MYSQL.RESTART.WINDOW}
              tags:
                - tag: scope
                  value: innodb
        - uuid: 035d705f14484ed0bbc76346078c9085
          name: 'MySQL: InnoDB waits for a free page'
          type: DEPENDENT
          key: mysql.innodb.wait_free
          delay: '0'
          value_type: FLOAT
          units: /s
          description: Reads that had to wait for InnoDB to flush a page before a buffer pool page was free. Above 0 means the buffer pool is too small or flushing cannot keep up.
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_status_innodb_buffer_pool_wait_free
                - value
                - ''
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: innodb
        - uuid: b83a55645b6e4056a4db5250fc706fdf
          name: 'MySQL: InnoDB data read'
          type: DEPENDENT
          key: mysql.innodb.data_read
          delay: '0'
          value_type: FLOAT
          units: Bps
          preprocessing:
