zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: c28931f80bf1459883da30e82ed630a5
      name: Templates/Databases
  templates:
    - uuid: 751fdf5f84634b14a2736f2689adba95
      template: MySQL by mysqld_exporter
      name: MySQL by mysqld_exporter
      description: |-
        Scrapes mysqld_exporter over HTTP from a Zabbix proxy inside the cluster. No Zabbix agent or ODBC needed.

        Per host: set {$MYSQL.EXPORTER.SVC} to <service>.<namespace>.svc.cluster.local:9104 and monitor the host by the cluster's proxy.
        Database sizes need the exporter flag --collect.info_schema.tables; without it, Database discovery stays empty.
      vendor:
        name: HIT
        version: 7.4-2
      groups:
        - name: Templates/Databases
      items:
        - uuid: 5ba0373a5da84c01bd6be5e8c4df78d8
          name: 'MySQL: exporter raw'
          type: HTTP_AGENT
          key: mysql.exporter.raw
          history: '0'
          value_type: TEXT
          trends: '0'
          description: Raw Prometheus text from mysqld_exporter. Every other item is a dependent item of this one.
          url: http://{$MYSQL.EXPORTER.SVC}/metrics
          timeout: '{$MYSQL.EXPORTER.TIMEOUT}'
          headers:
            - name: User-Agent
              value: Zabbix
          tags:
            - tag: component
              value: raw
        - uuid: 7157158b0e1e44bcb404ad9c74f149fb
          name: 'MySQL: Up'
          type: DEPENDENT
          key: mysql.up
          delay: '0'
          description: 1 when the exporter could connect to MySQL on this scrape, otherwise 0.
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_up
                - value
                - ''
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: availability
          triggers:
            - uuid: d04ac410b9754c4abd670632fe93cfc9
              expression: last(/MySQL by mysqld_exporter/mysql.up)=0
              name: 'MySQL: the exporter cannot connect to MySQL'
              priority: HIGH
              description: 'The exporter answers but its connection to MySQL fails: MySQL is down or restarting, every connection is taken (max_connections, see "refused connections"), or the exporter''s user or password has changed.'
              tags:
                - tag: scope
                  value: availability
            - uuid: 0190b2bb19fd4a31b52e3f8bebd0a6a1
              expression: nodata(/MySQL by mysqld_exporter/mysql.up,{$MYSQL.NODATA})=1
              name: 'MySQL: no data from mysqld_exporter for {$MYSQL.NODATA}'
              priority: AVERAGE
              description: 'The proxy cannot fetch the exporter''s /metrics. The exporter runs as a sidecar in the MySQL pod, so the usual cause is the pod itself being down. Otherwise: the Service or port in {$MYSQL.EXPORTER.SVC} is wrong, or a NetworkPolicy blocks the Zabbix namespace.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 8e56ed8533d04fc685e30494dce76597
          name: 'MySQL: Uptime'
          type: DEPENDENT
          key: mysql.uptime
          delay: '0'
          units: uptime
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_status_uptime
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: availability
          triggers:
            - uuid: 43f87f630e674f9fa4221bfcd22c82dd
              expression: last(/MySQL by mysqld_exporter/mysql.uptime)<{$MYSQL.RESTART.WINDOW}
              name: 'MySQL: restarted (uptime {ITEM.LASTVALUE1})'
              priority: WARNING
              description: 'MySQL has been running for less than {$MYSQL.RESTART.WINDOW} seconds. An OOMKill of the pod shows up here: check the pod''s restart count and last state. A restart by hand does too. Resolves by itself.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 05f6fefb70ef41228cdfbd0ab783b5bc
          name: 'MySQL: Version'
          type: DEPENDENT
          key: mysql.version
          delay: '0'
          value_type: CHAR
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_version_info
                - label
                - version
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: build
        - uuid: 4eab4c74470f40368dd5d28ef81a99a2
          name: 'MySQL: Exporter version'
          type: DEPENDENT
          key: mysql.exporter.version
          delay: '0'
          value_type: CHAR
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysqld_exporter_build_info
                - label
                - version
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: build
        - uuid: b8324acd70014bd487bf9577d6e516e6
          name: 'MySQL: Failing exporter collectors'
          type: DEPENDENT
          key: mysql.exporter.collectors_failed
          delay: '0'
          description: 'Collectors whose query failed on the latest scrape. The usual cause is a missing grant: the exporter''s user needs PROCESS, REPLICATION CLIENT and SELECT.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_exporter_collector_success == 0
                - function
                - count
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: exporter
          triggers:
            - uuid: 63b137d225744abeb8437ec7110bffed
              expression: min(/MySQL by mysqld_exporter/mysql.exporter.collectors_failed,10m)>0
              name: 'MySQL: {ITEM.LASTVALUE1} exporter collectors are failing'
              priority: WARNING
              description: Some metrics are missing. Run curl against the exporter and look at mysql_exporter_collector_success, then at the exporter's log.
              tags:
                - tag: scope
                  value: exporter
        - uuid: 8d88a9b5e03948cb9781589b8eb9acc5
          name: 'MySQL: Connections'
          type: DEPENDENT
          key: mysql.threads_connected
          delay: '0'
          value_type: UNSIGNED
          description: Open client connections (Threads_connected).
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_status_threads_connected
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: connections
        - uuid: d332a0fe6d3e41b4a32187640059d5dd
          name: 'MySQL: Running threads'
          type: DEPENDENT
          key: mysql.threads_running
          delay: '0'
          value_type: UNSIGNED
          description: Connections executing a statement right now. Stays in single digits on a healthy server; a pile-up means queries are waiting on locks or I/O.
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_status_threads_running
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: connections
        - uuid: 598a2efeabba4d6ab02f22bc9601e1f4
          name: 'MySQL: Max used connections'
          type: DEPENDENT
          key: mysql.max_used_connections
          delay: '0'
          value_type: UNSIGNED
          description: The peak since MySQL started.
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_status_max_used_connections
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: connections
        - uuid: 1160f65ed67b4228803f70a46d493ca3
          name: 'MySQL: max_connections'
          type: DEPENDENT
          key: mysql.max_connections
          delay: '0'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_variables_max_connections
                - value
                - ''
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: connections
        - uuid: 419a870e9f6547688064db0525459774
          name: 'MySQL: Connection usage'
          type: CALCULATED
          key: mysql.connections.util
          value_type: FLOAT
          params: 100*last(//mysql.threads_connected)/last(//mysql.max_connections)
          units: '%'
          description: Connections as a share of max_connections.
          tags:
            - tag: component
              value: connections
          triggers:
            - uuid: e639b7f2127a41b49dd3c2786343c999
              expression: min(/MySQL by mysqld_exporter/mysql.connections.util,5m)>{$MYSQL.CONN.UTIL.WARN}
              name: 'MySQL: more than {$MYSQL.CONN.UTIL.WARN}% of max_connections in use for 5m'
              priority: WARNING
              description: Close to the limit where MySQL refuses new connections and the installations get "Too many connections". Every web pod, worker and per-minute schedule pod holds its own connection.
              tags:
                - tag: scope
                  value: connections
        - uuid: deec47f413fb46f7a77e205c4cfe4a97
          name: 'MySQL: Refused connections (max_connections)'
          type: DEPENDENT
          key: mysql.connections.refused
          delay: '0'
          value_type: FLOAT
          units: /s
          description: Connections MySQL turned away because max_connections was reached.
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_status_connection_errors_total{error="max_connections"}
                - value
                - ''
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: connections
          triggers:
            - uuid: a7c8005c2ed2427bb43765818f869944
              expression: max(/MySQL by mysqld_exporter/mysql.connections.refused,5m)>0
              name: 'MySQL: refusing connections, max_connections reached'
              priority: AVERAGE
              description: Requests and jobs in the installations are failing with "Too many connections". Find what holds the connections (SHOW PROCESSLIST), or raise max_connections.
              tags:
                - tag: scope
                  value: connections
        - uuid: 4ab70c2cbc13430b9cb4cf3b771de89d
          name: 'MySQL: Aborted connects'
          type: DEPENDENT
          key: mysql.aborted_connects
          delay: '0'
