                - value
                - ''
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: tables
      discovery_rules:
        - uuid: af03ec337ff44f78b4ee51adde80ac43
          name: Database discovery
          type: DEPENDENT
          key: mysql.schema.discovery
          delay: '0'
          description: One item per database. Stays empty unless the exporter runs with --collect.info_schema.tables. A database missing from the scrapes for an hour gets its item disabled, for 7 days deleted, so a MySQL restart leaves the items alone.
          lifetime_type: DELETE_AFTER
          lifetime: 7d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          master_item:
            key: mysql.exporter.raw
          filter:
            conditions:
              - macro: '{#SCHEMA}'
                value: '{$MYSQL.SCHEMA.MATCHES}'
                formulaid: A
              - macro: '{#SCHEMA}'
                value: '{$MYSQL.SCHEMA.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
            evaltype: AND
          lld_macro_paths:
            - lld_macro: '{#SCHEMA}'
              path: $.schema
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - mysql_info_schema_table_size{component="data_length"}
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |-
                  var seen = {};
                  JSON.parse(value).forEach(function (m) { seen[m.labels.schema] = true; });
                  return JSON.stringify(Object.keys(seen).map(function (s) { return {schema: s}; }));
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          item_prototypes:
            - uuid: 49109883258b4bdea4bbd6de5a8cbb43
              name: 'Database {#SCHEMA}: size'
              type: DEPENDENT
              key: mysql.schema.size[{#SCHEMA}]
              delay: '0'
              units: B
              description: Data plus indexes, from information_schema.tables. MySQL refreshes these statistics lazily (information_schema_stats_expiry), so the value moves in steps.
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - mysql_info_schema_table_size{schema="{#SCHEMA}",component=~"data_length|index_length"}
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: mysql.exporter.raw
              tags:
                - tag: component
                  value: storage
                - tag: database
                  value: '{#SCHEMA}'
      tags:
        - tag: class
          value: database
        - tag: target
          value: mysql
      macros:
        - macro: '{$MYSQL.BUFFER_POOL.HIT.MIN}'
          value: '95'
          description: Lowest acceptable InnoDB buffer pool hit ratio, in percent, held for 15 minutes.
        - macro: '{$MYSQL.CONN.UTIL.WARN}'
          value: '80'
          description: Connection usage, in percent of max_connections, held for 5 minutes before the Warning trigger fires.
        - macro: '{$MYSQL.EXPORTER.SVC}'
          value: mysql.mysql.svc.cluster.local:9104
          description: host:port of the exporter as the cluster's Zabbix proxy reaches it.
        - macro: '{$MYSQL.EXPORTER.TIMEOUT}'
          value: 10s
          description: Timeout for the scrape.
        - macro: '{$MYSQL.NODATA}'
          value: 5m
          description: How long without an answer from the exporter before the no-data trigger fires.
        - macro: '{$MYSQL.RESTART.WINDOW}'
          value: '600'
          description: Seconds after a start during which the restart trigger stays on.
        - macro: '{$MYSQL.SCHEMA.MATCHES}'
          value: .*
          description: Databases to discover (regex).
        - macro: '{$MYSQL.SCHEMA.NOT_MATCHES}'
          value: ^(mysql|sys|performance_schema|information_schema)$
          description: Databases to skip (regex).
        - macro: '{$MYSQL.SLOW_QUERIES.MAX}'
          value: '0.1'
          description: Slow queries per second, held for 5 minutes, before the Warning trigger fires.
        - macro: '{$MYSQL.TABLE_CACHE.MISSES.MAX}'
          value: '1'
          description: Table cache misses per second, held for 30 minutes, before the Warning trigger fires.
