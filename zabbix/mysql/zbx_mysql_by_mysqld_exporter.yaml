        - uuid: e58611725ca7488e93ecfaf681b86bd4
          name: 'MySQL: table_open_cache'
          type: DEPENDENT
          key: mysql.table_open_cache
          delay: '0'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_variables_table_open_cache
                - value
                - ''
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: tables
        - uuid: 53f7b27f337649f08f1af35ba342c11d
          name: 'MySQL: Table cache usage'
          type: CALCULATED
          key: mysql.table_open_cache.util
          value_type: FLOAT
          params: 100*last(//mysql.open_tables)/last(//mysql.table_open_cache)
          units: '%'
          description: Open table instances as a share of table_open_cache. A table used by two connections at once takes two entries, so with many tenant databases this sits at 100% and MySQL evicts the least recently used table. That is normal; the misses item says whether it costs anything.
          tags:
            - tag: component
              value: tables
        - uuid: b0418720bf3249959e601ee3988204b0
          name: 'MySQL: Table cache misses'
          type: DEPENDENT
          key: mysql.table_open_cache.misses
          delay: '0'
          value_type: FLOAT
          units: /s
          description: Table opens the cache could not serve. High right after a restart, then near 0 while the cache is big enough.
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_status_table_open_cache_misses
                - value
                - ''
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: tables
          triggers:
            - uuid: 47eb459b2d744680b611738dc676db38
              expression: min(/MySQL by mysqld_exporter/mysql.table_open_cache.misses,30m)>{$MYSQL.TABLE_CACHE.MISSES.MAX}
              name: 'MySQL: reopening more than {$MYSQL.TABLE_CACHE.MISSES.MAX} tables per second for 30m'
              priority: WARNING
              description: The table cache is too small for the working set, so MySQL keeps closing and reopening tables. Raise table_open_cache (SET PERSIST works without a restart, then put it in my.cnf), and table_definition_cache if the number of tables is close to it. Each entry costs memory, so watch the pod's memory afterwards. A freshly started server fills its cache first, so this stays quiet while the restart trigger is active.
              dependencies:
                - name: 'MySQL: restarted (uptime {ITEM.LASTVALUE1})'
                  expression: last(/MySQL by mysqld_exporter/mysql.uptime)<{$MYSQL.RESTART.WINDOW}
              tags:
                - tag: scope
                  value: tables
        - uuid: 0b60ff5afbb746028499033db3e1b773
          name: 'MySQL: Open table definitions'
          type: DEPENDENT
          key: mysql.open_table_definitions
          delay: '0'
          value_type: UNSIGNED
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - mysql_global_status_open_table_definitions
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: mysql.exporter.raw
          tags:
            - tag: component
              value: tables
        - uuid: 074f599d7b8646ecba6984f9ed4135d7
          name: 'MySQL: table_definition_cache'
          type: DEPENDENT
          key: mysql.table_definition_cache
          delay: '0'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
